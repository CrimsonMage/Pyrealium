[package]
name = "ac2-db"
edition = "2021"
version = "0.1.0"
publish = false
license = "AGPL-3.0-only"

[lints.clippy]
# Retail comparisons are written `!(a < b)` on purpose (they differ for NaN); retail signatures
# keep their parameters and tuple types.
neg_cmp_op_on_partial_ord = "allow"
manual_range_contains = "allow"
too_many_arguments = "allow"
type_complexity = "allow"

[dependencies]
ac2-core = { path = "../ac2-core" }
ac2-dat = { path = "../ac2-dat" }
flate2 = "1.1.2"
log = "0.4"
concurrent-queue = "2.5"
rayon = "1.12"

[dev-dependencies]
tempfile = "3.27.0"
ac2-dat = { path = "../ac2-dat", features = ["test-support"] }
