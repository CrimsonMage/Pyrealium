[package]
name = "ac2-dat"
edition = "2021"
version = "0.1.0"
publish = false
license = "AGPL-3.0-only"

[lints.clippy]
# Retail comparisons are written `!(a < b)` on purpose (they differ for NaN); retail signatures
# keep their parameters and tuple types.
neg_cmp_op_on_partial_ord = "allow"
manual_range_contains = "allow"
too_many_arguments = "allow"
type_complexity = "allow"

[dependencies]
ac2-core = { path = "../ac2-core" }
encoding_rs = "0.8"
serde = { version = "1.0.228", features = ["derive"] }

[features]
# One shared `AC2_DAT_DIR` mount per test process; enabled from dev-dependencies only.
test-support = []

[dev-dependencies]
tempfile = "3.27.0"
