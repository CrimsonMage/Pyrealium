[package]
name = "pyrealium"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Pyrealium native AC2 server (continuing AC2E, derived from Pyrealium)"
license = "AGPL-3.0-only"
repository = "https://github.com/CrimsonMage/Pyrealium"

[[bin]]
name = "pyrealium"
path = "src/main.rs"

[dependencies]
ac2-assets = { path = "../ac2-assets" }
ac2-physics = { path = "../ac2-physics" }
ac2-world = { path = "../ac2-world" }
ac2-core = { path = "../ac2-core" }
ac2-dat = { path = "../ac2-dat" }
ac2-db = { path = "../ac2-db" }
argon2 = "0.5.3"
getrandom = "0.2.16"
rpassword = "7.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiny_http = "0.12"
zeroize = "1.8"
postgres = { version = "0.19", features = ["with-serde_json-1"] }
toml = "0.9"

[[bench]]
name = "transport"
harness = false

[[bench]]
name = "scene"
harness = false


[lints.rust]
unsafe_code = "forbid"
