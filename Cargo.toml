# All of Pyrealium's Rust code: the server (crates/pyrealium), the DAT/resource/world/physics and
# protocol crates it builds on (crates/ac2-*), and the scripted test client (crates/ac2-network-bridge).
[workspace]
resolver = "2"
members = ["crates/*"]

# The bundled SQLite (the content database: tens of thousands of rows) is optimised in debug and
# test builds too; unoptimised, loading the content dump takes a minute instead of a second.
[profile.dev.package.libsqlite3-sys]
opt-level = 3

[profile.release]
overflow-checks = true
lto = "thin"
